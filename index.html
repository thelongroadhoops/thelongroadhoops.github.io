<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask The Long Road</title>
<meta name="description" content="Ask a quick question about anything in The Long Road, the free newsletter on US college basketball recruiting for European families.">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: #fafaf7;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid #e6e2d9;
    background: #fff;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 14px;
    color: #555;
  }
  main { flex: 1; display: flex; }
  iframe {
    flex: 1;
    border: 0;
    width: 100%;
    min-height: 60vh;
    background: #fff;
  }
  footer {
    padding: 14px 24px;
    border-top: 1px solid #e6e2d9;
    background: #fff;
    font-size: 13px;
    color: #666;
    text-align: center;
  }
  footer a { color: #1a1a1a; }
</style>
</head>
<body>
  <header>
    <h1>Ask The Long Road</h1>
    <p>An automated tool trained on The Long Road issues. Not Ville. One free clarification question per issue for subscribers.</p>
  </header>
  <main>
    <iframe
      src="https://chatraj.com/widget/b3fec60a-d7dd-470f-9adc-6ac07f0fc25e"
      title="Ask The Long Road"
      allow="microphone"
      loading="eager"></iframe>
  </main>
  <footer>
    Not a subscriber? <a href="https://thelongroadhoops.substack.com/subscribe">Sign up free at The Long Road</a>.
  </footer>
</body>
</html>
